<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta name="robots" content="noindex"><title>获取最新版 · 神人刘题库</title><style>body{font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif;max-width:560px;margin:12vh auto;padding:24px;color:#172033;background:#f5f7fb}button{font:inherit;background:#2563eb;color:white;padding:12px 20px;border:0;border-radius:12px}p{overflow-wrap:anywhere}.note{font-size:14px;color:#687386}</style></head><body data-mobile-recovery><h1>正在获取最新版</h1><p id="status" role="status">正在联网确认发布版本…</p><button id="retry" onclick="recoverLatest()">重新获取</button><p class="note">这里会绕过旧页面，直接读取最新发布的页面和文件。仍使用原网站、本浏览器的学习记录，不清理答题数据。</p><p><a id="fallback" href="https://huahai061x-ship-it.github.io/shenrenliu-qbank/latest.html">直接进入新版入口</a></p><script>
(function(){'use strict';var busy=false,root='https://huahai061x-ship-it.github.io/shenrenliu-qbank/';function status(text){document.getElementById('status').textContent=text;}function request(url,done){var xhr=new XMLHttpRequest();xhr.open('GET',url,true);xhr.timeout=25000;xhr.setRequestHeader('Cache-Control','no-cache');xhr.onload=function(){if(xhr.status===200)done(null,xhr.responseText);else done(Error('HTTP '+xhr.status));};xhr.onerror=function(){done(Error('无法连接版本服务器'));};xhr.ontimeout=function(){done(Error('联网超时，请切换 Wi-Fi 或手机流量后重试'));};xhr.send();}function fail(error){busy=false;document.getElementById('retry').disabled=false;status(error.message+'。原有学习记录没有被清除。');}window.recoverLatest=function(){if(busy)return;busy=true;document.getElementById('retry').disabled=true;status('正在联网确认发布版本…');var nonce=Date.now()+'-'+Math.random().toString(36).slice(2);request(root+'release.json?_recovery='+nonce,function(error,text){if(error)return fail(error);try{var release=JSON.parse(text);if(release.schemaVersion!==1||!/^[a-zA-Z0-9._-]{1,100}$/.test(release.version))throw Error('版本信息无效');var page=root+'releases/'+release.version+'.html?_recovery='+nonce;document.getElementById('fallback').href=page;status('已确认最新发布，正在载入…');request(page,function(error,html){if(error)return fail(error);try{if(html.indexOf('name="build-version" content="'+release.version+'"')<0)throw Error('页面批次与最新发布不一致，请重试');var canonical=root+location.search+location.hash;html=html.replace('<base data-release-root href="../">','<base data-release-root href="'+root+'">');history.replaceState(history.state,'',canonical);document.open();document.write(html);document.close();}catch(e){fail(e);}});}catch(e){fail(e);}});};window.recoverLatest();})();
</script></body></html>
