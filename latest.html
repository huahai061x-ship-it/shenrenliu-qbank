<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="robots" content="noindex"><title>获取最新版 · 神人刘题库训练站</title><style>body{font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#172033}main{max-width:560px;margin:12vh auto;padding:24px}button,a{font:inherit}button{background:#2563eb;color:white;border:0;border-radius:12px;padding:12px 22px;cursor:pointer}p{overflow-wrap:anywhere}.note{color:#687386;font-size:14px}#status{min-height:58px}</style></head><body data-latest-entry><main><h1>获取网站最新版</h1><p id="status" role="status" aria-live="polite">正在联网确认最新版本…</p><button id="retry" onclick="checkLatest()">重新获取最新版</button><p class="note">这个入口会跳过旧页面，联网获取本次发布的文件。原网址、桌面图标与本浏览器的学习记录继续保留，无需清理数据。</p><p class="note">微信、QQ 中若无法打开，可在右上角菜单选择“在浏览器打开”。不同浏览器的本机记录彼此独立。</p><p><a href="./">返回原网站</a></p></main><script>
(function(){'use strict';var busy=false,attempt=0;function message(s){document.getElementById('status').textContent=s;}window.checkLatest=function(){if(busy)return;busy=true;attempt++;var button=document.getElementById('retry');button.disabled=true;message('正在联网确认最新版本…');var request=new XMLHttpRequest();request.open('GET','release.json?_fresh='+Date.now()+'-'+Math.random().toString(36).slice(2),true);request.timeout=20000;request.setRequestHeader('Cache-Control','no-cache');function fail(s){busy=false;button.disabled=false;message(s+' 你的本机学习记录没有被清除。');}request.onload=function(){try{if(request.status!==200)throw Error('版本服务暂未成功返回（HTTP '+request.status+'）');var release=JSON.parse(request.responseText);if(release.schemaVersion!==1||!release.version||!/^[a-zA-Z0-9._-]{1,100}$/.test(release.version))throw Error('版本信息不完整');var expected='releases/'+release.version+'.html';if(release.page&&release.page!==expected)throw Error('版本入口不匹配');message('已确认最新版，正在进入…');var target=new URL(expected,location.href);target.search=location.search;target.searchParams.delete('entry');target.hash=location.hash;location.replace(target.href);}catch(e){fail(e.message||'版本检查未完成');}};request.onerror=function(){fail('暂时无法连接版本服务器，请检查网络后重试。');};request.ontimeout=function(){fail('联网检查超时，可切换 Wi-Fi 或手机流量后重试。');};request.send();};window.checkLatest();})();
</script></body></html>
